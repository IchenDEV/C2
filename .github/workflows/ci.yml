name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            taskboard:
              - 'apps/desktop/src/taskboard/**'
              - 'apps/desktop/tests/taskBoard*'
              - 'apps/desktop/stryker.taskboard.config.json'
              - 'apps/desktop/tsconfig.stryker.json'
            rust:
              - 'crates/**'
              - 'apps/desktop/src-host/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
      - name: Install dependencies
        run: bun install --frozen-lockfile --cwd apps/desktop
      - name: Desktop lint and typecheck
        working-directory: apps/desktop
        run: |
          bun run check
          bunx tsc --noEmit
      - name: Desktop tests
        working-directory: apps/desktop
        run: bun run test:ci
      - name: TaskBoard mutation testing
        if: steps.changes.outputs.taskboard == 'true'
        working-directory: apps/desktop
        run: bun run mutation:taskboard
      - name: Build desktop renderer
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx vite build
      - name: Install Zig 0.15.2
        if: steps.changes.outputs.rust == 'true'
        run: |
          curl -L https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz | tar xJ -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Rust workspace check
        if: steps.changes.outputs.rust == 'true'
        run: cargo check --workspace --all-targets
      - name: Rust workspace test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace
