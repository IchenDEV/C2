[package]
name = "codetwo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared C2 product core: ACP, providers, sessions, skills, policy, and persistence."

[features]
default = ["terminal"]
terminal = ["dep:libghostty-vt"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid.workspace = true
tracing.workspace = true
blake3 = "1"
sha2 = "0.10"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "=0.45.1", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
url = "2"
toml = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "8.2"
fs2 = "0.4.3"
libc = "0.2"
# Ghostty's VT engine (parsing, scrollback, reflow) behind a C API. NOTE: this builds Ghostty from
# source with Zig — see the terminal section of docs/reference/architecture.md for the toolchain requirement.
libghostty-vt = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSLocale", "NSSet", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-speech = { version = "0.3", features = ["SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription", "SFErrors", "block2"] }
